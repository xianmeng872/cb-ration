<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>ADILE · 投资工具站</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{min-height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:#f5f7fa;
    color:#1a2230;
    -webkit-font-smoothing:antialiased;
  }
  .top{position:fixed;top:0;left:0;right:0;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;z-index:20}
  .logo{font-weight:800;letter-spacing:3px;font-size:18px;background:linear-gradient(90deg,#f97316,#5573a8);-webkit-background-clip:text;background-clip:text;color:transparent}
  .login-btn{padding:8px 18px;border:1px solid #d7dee8;border-radius:22px;background:#fff;color:#475067;font-size:13px;cursor:pointer;transition:.25s}
  .login-btn:hover{border-color:#5573a8;color:#5573a8}
  .login-btn.on{border-color:#f97316;color:#f97316}
  .wrap{max-width:1080px;margin:0 auto;padding:120px 28px 80px}
  .lead{text-align:center;margin-bottom:56px}
  .eyebrow{font-size:12px;letter-spacing:4px;color:#9aa4b2;text-transform:uppercase;margin-bottom:14px}
  .lead h1{font-size:clamp(30px,5vw,52px);font-weight:800;letter-spacing:1px;line-height:1.15}
  .lead p{margin-top:16px;font-size:15px;color:#6b7484;letter-spacing:.5px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
  .card{
    background:#fff;border:1px solid #e6ebf2;border-radius:18px;padding:34px 30px;
    text-decoration:none;color:inherit;display:block;position:relative;overflow:hidden;
    transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s;
    opacity:0;transform:translateY(24px);animation:rise .6s forwards;
  }
  .card:nth-child(2){animation-delay:.12s}
  @keyframes rise{to{opacity:1;transform:translateY(0)}}
  .card::before{content:"";position:absolute;left:0;top:0;height:4px;width:100%;transform:scaleX(0);transform-origin:left;transition:transform .4s}
  .card.cb::before{background:linear-gradient(90deg,#fb923c,#f97316)}
  .card.gridc::before{background:linear-gradient(90deg,#9fb3d6,#5573a8)}
  .card:hover{transform:translateY(-8px);box-shadow:0 24px 50px -22px rgba(40,60,90,.35)}
  .card:hover::before{transform:scaleX(1)}
  .icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;margin-bottom:20px}
  .cb .icon{background:#fff3e9;color:#f97316}
  .gridc .icon{background:#eef2f9;color:#5573a8}
  .icon svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .card h3{font-size:22px;font-weight:800;letter-spacing:.5px}
  .card .sub{margin-top:10px;font-size:14px;color:#7a8494;line-height:1.6}
  .card .go{margin-top:22px;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700}
  .cb .go{color:#f97316}
  .gridc .go{color:#5573a8}
  .card .go span{transition:transform .3s}
  .card:hover .go span{transform:translateX(4px)}
  footer{text-align:center;color:#aab2bf;font-size:13px;padding:40px 0 50px;letter-spacing:1px}
  .modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(20,30,45,.5);backdrop-filter:blur(3px)}
  .modal.hidden{display:none}
  .box{background:#fff;border-radius:18px;padding:30px 28px;width:320px;text-align:center;box-shadow:0 30px 70px rgba(0,0,0,.25)}
  .box h3{font-size:18px;margin-bottom:18px;letter-spacing:2px}
  .box input{width:100%;padding:11px 13px;margin:7px 0;border:1px solid #dce3ec;border-radius:9px;font-size:14px;box-sizing:border-box}
  .box .acts{display:flex;gap:10px;margin-top:12px}
  .box .acts button{flex:1;padding:11px;border:none;border-radius:9px;font-size:14px;color:#fff;cursor:pointer}
  #login-do{background:#5573a8}
  #register-do{background:#f97316}
  #msg{margin-top:12px;font-size:12px;color:#9aa4b2;min-height:16px}
  @media(max-width:680px){
    .top{height:52px;padding:0 16px}
    .logo{font-size:15px;letter-spacing:2px}
    .login-btn{padding:6px 13px;font-size:12px;border-radius:18px}
    .wrap{padding:74px 16px 34px}
    .lead{margin-bottom:22px}
    .eyebrow{font-size:11px;letter-spacing:3px;margin-bottom:7px}
    .lead h1{font-size:23px;line-height:1.22;letter-spacing:0}
    .lead p{margin-top:8px;font-size:13px}
    .grid{grid-template-columns:1fr;gap:12px}
    .card{padding:18px 18px;border-radius:13px}
    .card:nth-child(2){animation-delay:.08s}
    .icon{width:38px;height:38px;border-radius:11px;margin-bottom:12px}
    .icon svg{width:19px;height:19px}
    .card h3{font-size:17px}
    .card .sub{margin-top:6px;font-size:12.5px;line-height:1.45}
    .card .go{margin-top:11px;font-size:12.5px}
    footer{padding:22px 0 26px;font-size:12px}
  }
</style>
</head>
<body>
<div class="top">

<!-- 登录/注册弹窗由 auth-client.js 动态注入 -->

<script>
const WG_API="https://cb-ration-sync-cb-ration-sync-lvfqccjwzs.cn-shenzhen.fcapp.run/api/wg";
let wgUser=null,wgGrids=[],wgOnline=false;
function wgUtf8(s){const b=[];for(let i=0;i<s.length;i++){let c=s.charCodeAt(i);if(c<0x80)b.push(c);else if(c<0x800)b.push(0xc0|(c>>6),0x80|(c&0x3f));else if(c<0x10000)b.push(0xe0|(c>>12),0x80|((c>>6)&0x3f),0x80|(c&0x3f));else{c-=0x10000;b.push(0xf0|(c>>18),0x80|((c>>12)&0x3f),0x80|((c>>6)&0x3f),0x80|(c&0x3f));}}return b;}
function wgRrot(x,n){return((x>>>n)|(x<<(32-n)))>>>0;}
function wgShr(x,n){return(x>>>n)>>>0;}
function wgSha256(str){const msg=wgUtf8(str);const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];const bitLen=msg.length*8;msg.push(0x80);while(msg.length%64!==56)msg.push(0);msg.push(0,0,0,0);msg.push((bitLen>>24)&0xff,(bitLen>>16)&0xff,(bitLen>>8)&0xff,bitLen&0xff);const w=new Array(64);for(let off=0;off<msg.length;off+=64){for(let i=0;i<16;i++)w[i]=(msg[off+i*4]<<24)|(msg[off+i*4+1]<<16)|(msg[off+i*4+2]<<8)|msg[off+i*4+3];for(let i=16;i<64;i++){const s0=wgRrot(w[i-15],7)^wgRrot(w[i-15],18)^wgShr(w[i-15],3);const s1=wgRrot(w[i-2],17)^wgRrot(w[i-2],19)^wgShr(w[i-2],10);w[i]=(w[i-16]+s0+w[i-7]+s1)|0;}let a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];for(let i=0;i<64;i++){const S1=wgRrot(e,6)^wgRrot(e,11)^wgRrot(e,25);const ch=(e&f)^((~e)&g);const t1=(h+S1+ch+K[i]+w[i])|0;const S0=wgRrot(a,2)^wgRrot(a,13)^wgRrot(a,22);const maj=(a&b)^(a&c)^(b&c);const t2=(S0+maj)|0;h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0;}H[0]=(H[0]+a)|0;H[1]=(H[1]+b)|0;H[2]=(H[2]+c)|0;H[3]=(H[3]+d)|0;H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0;}return H.map(v=>(v>>>0).toString(16).padStart(8,'0')).join('');}
function wgKey(){return"wg/"+wgToken+".json";}
function wgRotl(x,n){return((x<<n)|(x>>>(32-n)))>>>0;}
function wgSha1Bytes(msg){if(typeof msg==='string')msg=wgUtf8(msg);msg=msg.slice();let h0=0x67452301,h1=0xEFCDAB89,h2=0x98BADCFE,h3=0x10325476,h4=0xC3D2E1F0;const ml=msg.length*8;msg.push(0x80);while(msg.length%64!==56)msg.push(0);msg.push(0,0,0,0,(ml>>>24)&0xff,(ml>>>16)&0xff,(ml>>>8)&0xff,ml&0xff);for(let off=0;off<msg.length;off+=64){const w=new Array(80);for(let i=0;i<16;i++)w[i]=(msg[off+i*4]<<24)|(msg[off+i*4+1]<<16)|(msg[off+i*4+2]<<8)|msg[off+i*4+3];for(let i=16;i<80;i++)w[i]=wgRotl(w[i-3]^w[i-8]^w[i-14]^w[i-16],1);let a=h0,b=h1,c=h2,d=h3,e=h4;for(let i=0;i<80;i++){let f,k;if(i<20){f=(b&c)|((~b)&d);k=0x5A827999;}else if(i<40){f=b^c^d;k=0x6ED9EBA1;}else if(i<60){f=(b&c)|(b&d)|(c&d);k=0x8F1BBCDC;}else{f=b^c^d;k=0xCA62C1D6;}const tmp=(wgRotl(a,5)+f+e+k+(w[i]>>>0))>>>0;e=d;d=c;c=wgRotl(b,30);b=a;a=tmp;}h0=(h0+a)>>>0;h1=(h1+b)>>>0;h2=(h2+c)>>>0;h3=(h3+d)>>>0;h4=(h4+e)>>>0;}return[h0,h1,h2,h3,h4];}
function wgSha1Bytes20(msg){const w=wgSha1Bytes(msg);const out=[];for(const word of w)out.push((word>>>24)&0xff,(word>>>16)&0xff,(word>>>8)&0xff,word&0xff);return out;}
function wgHmacSha1(keyStr,msgStr){let key=wgUtf8(keyStr);if(key.length>64)key=wgSha1Bytes20(key);const k=new Array(64).fill(0);for(let i=0;i<key.length;i++)k[i]=key[i];const ipad=new Array(64),opad=new Array(64);for(let i=0;i<64;i++){ipad[i]=k[i]^0x36;opad[i]=k[i]^0x5c;}const inner=ipad.concat(wgUtf8(msgStr));const innerHash=wgSha1Bytes20(inner);const outer=opad.concat(innerHash);return wgSha1Bytes20(outer).map(v=>v.toString(16).padStart(2,'0')).join('');}
// 签名逻辑已迁移到后端（阿里云 FC /api/wg），前端不再持有腾讯云密钥
async function wgApiReq(method,body){const headers={'Content-Type':'application/json'};const t=CBAuth.getToken();if(t)headers['Authorization']='Bearer '+t;const init={method,headers};if(body!==undefined){init.body=typeof body==='string'?body:JSON.stringify(body);}const r=await fetch(WG_API,init);return{status:r.status,text:await r.text()};}
async function wgCosGet(key){const r=await wgApiReq('GET');if(r.status===404)return null;if(r.status>=400)throw new Error('GET '+r.status);return r.text;}
async function wgCosPut(key,obj){const r=await wgApiReq('POST',obj);if(r.status>=400)throw new Error('PUT '+r.status);return r;}
async function wgSyncGet(){try{const r=await wgApiReq('GET');if(r.status===404)throw new Error('not found');if(r.status>=400)throw new Error('GET '+r.status);const o=JSON.parse(r.text);const cloud=(o&&o.data&&Array.isArray(o.data.grids))?o.data.grids:(o&&Array.isArray(o.grids)?o.grids:null);if(cloud)return {grids:cloud};const c=JSON.parse(localStorage.getItem('wg_cache_v1')||'null');return {grids:(c&&c.grids)||[]};}catch(e){const c=JSON.parse(localStorage.getItem('wg_cache_v1')||'null');return {grids:(c&&c.grids)||[]};}}
async function wgSyncPut(obj){try{await wgApiReq('POST',obj);}catch(e){}}
function wgCacheSave(g){try{localStorage.setItem('wg_cache_v1',JSON.stringify({user:CBAuth.getUser(),grids:g||[]}));}catch(e){}}
function setLoginState(){const btn=document.getElementById('login-btn');const ob=document.getElementById('logout-btn');if(CBAuth.isLoggedIn()){btn.textContent='已登录: '+CBAuth.getUser();btn.classList.add('on');if(ob)ob.style.display='';}else{btn.textContent='登录 / 注册';btn.classList.remove('on');if(ob)ob.style.display='none';}}
async function refreshAfterAuth(){wgUser=CBAuth.getUser();try{const d=await wgSyncGet();wgGrids=d.grids||[];wgOnline=true;}catch(e){wgOnline=false;}wgCacheSave(wgGrids);setLoginState();if(typeof wgRenderLib==='function')wgRenderLib();if(typeof wgSetBar==='function')wgSetBar();}
CBAuth.init({apiBase:'https://cb-ration-sync-cb-ration-sync-lvfqccjwzs.cn-shenzhen.fcapp.run',onLogin:refreshAfterAuth,onLogout:function(){wgUser=null;wgGrids=[];wgOnline=false;wgCacheSave([]);setLoginState();if(typeof wgRenderLib==='function')wgRenderLib();}});
document.getElementById('login-btn').onclick=()=>CBAuth.showAuth();
(function ensureLogoutBtn(){const lb=document.getElementById('login-btn');if(!lb||document.getElementById('logout-btn'))return;const ob=document.createElement('button');ob.id='logout-btn';ob.className='login-btn';ob.textContent='退出';ob.style.display='none';ob.style.marginLeft='8px';ob.addEventListener('click',e=>{e.stopPropagation();CBAuth.logout();});lb.parentNode.insertBefore(ob,lb.nextSibling);})();
setLoginState();
if(CBAuth.isLoggedIn()){refreshAfterAuth();}
</script>
