name: 抓取待发新债数据

on:
  push:
    branches: [main]
  schedule:
    # 北京时间 08:30 / 12:00 / 17:00 / 21:00（UTC+8，cron 用 UTC）
    # 新债发行公告多在盘后或晚间发布，故晚间必抓一次
    - cron: '30 0 * * *'
    - cron: '0 4 * * *'
    - cron: '0 9 * * *'
    - cron: '0 13 * * *'
  workflow_dispatch:

# contents: 提交数据文件；pages/id-token: 抓完后**自行部署**
# 【关键】GitHub 为防递归，用 GITHUB_TOKEN 推送的 commit 不会触发 pages.yml 那类 push 型 workflow。
# 若指望 pages.yml 自动接手，数据会进仓库却永远不上线。故本 workflow 抓完必须自己完成 Pages 部署。
permissions:
  contents: write
  pages: write
  id-token: write

# 独立并发组：若与 pages.yml 共用 group:pages，用户 push 会同时触发两者，
# pages.yml 的 cancel-in-progress:true 会把本 workflow 直接取消（fetch_kline 就跑不到了）。
# 故用独立组 fetch-pending，保证抓取+自部署一定执行。
concurrency:
  group: fetch-pending
  cancel-in-progress: false

jobs:
  fetch:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 抓取集思录待发新债
        continue-on-error: true
        run: python scripts/fetch_pending.py

      - name: 抓取审核进度并回写页面快照
        continue-on-error: true
        run: python scripts/fetch_progress.py

      - name: 抓取K线快照(补全全部股票日线到最新交易日)
        continue-on-error: true
        run: python scripts/fetch_kline.py

      - name: 校验数据完整性（发布闸门，失败则阻断部署）
        run: python scripts/validate_data.py

      - name: 有变化才提交（待发名单/审核进度/K线任一变则提交）
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cb/data/kline.js cb/data/progress.js cb/data/progress_changed.js cb/data/pending.json cb/审核进度快照.json cb/kline_status.json
          if git diff --cached --quiet; then
            echo "名单、审核进度、K线均无变化，跳过提交"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(data): 自动更新待发名单/审核进度/K线快照"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # 仅在名单确有变化时才部署：名单没变说明线上已是最新，不必重复部署制造噪音。
      # 若某次部署异常导致线上落后，可到 Actions 页手动 Run workflow 重跑。
      - name: Setup Pages
        if: steps.commit.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.commit.outputs.changed == 'true'
        uses: actions/deploy-pages@v4

      # 数据健康哨兵：抓完数据后跑，检测「公告漏播」+「进度数据落后」两类异常。
      # 异常时若仓库配置了 PUSHPLUS_TOKEN secret 则推微信，否则只在日志报警（非阻塞）。
      # 放在最后、continue-on-error：哨兵本身出问题绝不影响前面的抓取与部署。
      - name: 数据健康哨兵（异常则微信报警）
        continue-on-error: true
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_SELFTEST: "1"
        run: python scripts/sentinel.py
